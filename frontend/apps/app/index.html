<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <!-- Apply a stored dark preference before first paint so a dark reader
        never sees a light frame. Light is the default. The key must match
        THEME_STORAGE_KEY in lib/theme/theme.ts, which owns the preference. -->
    <script src="/theme-preference.js"></script>
    <link rel="icon" href="/citeladder-favicon.ico" sizes="any" />
    <title>CiteLadder</title>
    <style>
      /* Geist and Sora are used when the reader has them installed;
         otherwise these metric-matched Arial faces stand in, so the layout is
         the same either way. */
      /* Match Arial's x-height to Geist's (0.530em vs 0.519em). Vertical
         overrides use Geist's 1005/-295/0 hhea metrics (1000 UPM), divided by
         size-adjust. */
      @font-face {
        font-family: 'Geist Fallback';
        src: local('Arial');
        font-weight: 100 500;
        size-adjust: 102.12%;
        ascent-override: 98.41%;
        descent-override: 28.89%;
        line-gap-override: 0%;
      }

      /* Match Arial's x-height to Sora's (0.534em vs 0.519em). Vertical
         overrides use Sora's 970/-290/0 hhea metrics (1000 UPM), divided by
         size-adjust. */
      @font-face {
        font-family: 'Sora Fallback';
        src: local('Arial');
        font-weight: 100 500;
        size-adjust: 102.89%;
        ascent-override: 94.28%;
        descent-override: 28.19%;
        line-gap-override: 0%;
      }

      :root {
        font-synthesis-weight: none;
        /* Geist carries body, UI and data (its tabular figures line up
           columns); Sora carries display headings. */
        --font-text: 'Geist Variable', 'Geist Fallback', Arial;
        --font-heading: 'Sora Variable', 'Sora Fallback', Arial;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
