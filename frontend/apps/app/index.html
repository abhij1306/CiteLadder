<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <!-- Apply a stored dark preference before first paint so a dark reader
        never sees a light frame. Light is the default. The key must match
        THEME_STORAGE_KEY in lib/theme/theme.ts, which owns the preference. -->
    <script src="/theme-preference.js"></script>
    <link rel="icon" href="/citeladder-favicon.ico" sizes="any" />
    <title>CiteLadder</title>
    <style>
      /* Lexend Deca, Outfit and the figure face are used when the reader has
         them installed; otherwise these metric-matched Arial faces stand in,
         so the layout is the same either way. */
      /* The figure face sets numbers only: digits and the marks that sit
         inside a number (. , : % + - −). Letters and spaces fall through to
         Lexend Deca, so a figure's unit or a "Not measured" in a figure cell
         stays in the text face, and the line box keeps Lexend Deca's metrics
         (the first family that covers the space). Keep this range in step
         with the fallback below and the MCP app. */
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: local('JetBrains Mono'), local('JetBrainsMono-Regular');
        font-weight: 300 500;
        font-style: normal;
        unicode-range: U+0025, U+002B-002E, U+0030-003A, U+2212;
      }

      /* Match Arial's x-height to Lexend Deca's (0.525em vs 0.519em). Vertical
         overrides use Lexend Deca's 1000/-250/0 hhea metrics (1000 UPM),
         divided by size-adjust. */
      @font-face {
        font-family: 'Lexend Deca Fallback';
        src: local('Arial');
        font-weight: 100 500;
        size-adjust: 101.16%;
        ascent-override: 98.86%;
        descent-override: 24.71%;
        line-gap-override: 0%;
      }

      /* Match Arial's x-height to Outfit's (0.460em vs 0.519em). Vertical
         overrides use Outfit's 1000/-260/0 hhea metrics (1000 UPM), divided
         by size-adjust. */
      @font-face {
        font-family: 'Outfit Fallback';
        src: local('Arial');
        font-weight: 100 500;
        size-adjust: 88.63%;
        ascent-override: 112.83%;
        descent-override: 29.33%;
        line-gap-override: 0%;
      }

      /* Scale Arial's tabular digits (0.556em) to JetBrains Mono's 0.600em
         advance, so a figure column keeps its width either way. Vertical
         overrides use JetBrains Mono's 1020/-300/0 hhea metrics (1000 UPM),
         divided by size-adjust. */
      @font-face {
        font-family: 'JetBrains Mono Fallback';
        src: local('Arial');
        font-weight: 100 500;
        size-adjust: 107.88%;
        ascent-override: 94.55%;
        descent-override: 27.81%;
        line-gap-override: 0%;
        unicode-range: U+0025, U+002B-002E, U+0030-003A, U+2212;
      }

      :root {
        font-synthesis-weight: none;
        /* Lexend Deca carries body, UI and data; Outfit carries display
           headings; the figure face sets the digits of figures in data roles
           (`--font-numeric` in globals.css), because Lexend Deca has no
           tabular figures (no `tnum`). */
        --font-text: 'Lexend Deca Variable', 'Lexend Deca Fallback', Arial;
        --font-heading: 'Outfit Variable', 'Outfit Fallback', Arial;
        --font-figure: 'JetBrains Mono Variable', 'JetBrains Mono Fallback';
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
