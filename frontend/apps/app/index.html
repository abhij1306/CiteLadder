<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <!-- Apply a stored dark preference before first paint so a dark reader
        never sees a light frame. Light is the default. The key must match
        THEME_STORAGE_KEY in lib/theme/theme.ts, which owns the preference. -->
    <script src="/theme-preference.js"></script>
    <link rel="icon" href="/citeladder-favicon.ico" sizes="any" />
    <title>CiteLadder</title>
    <style>
      /* Lexend Deca and Outfit are used when the reader has them installed;
         otherwise these metric-matched Arial faces stand in, so the layout is
         the same either way. */
      /* Match Arial's x-height to Lexend Deca's (0.525em vs 0.519em). Vertical
         overrides use Lexend Deca's 1000/-250/0 hhea metrics (1000 UPM),
         divided by size-adjust. */
      @font-face {
        font-family: 'Lexend Deca Fallback';
        src: local('Arial');
        font-weight: 100 500;
        size-adjust: 101.16%;
        ascent-override: 98.86%;
        descent-override: 24.71%;
        line-gap-override: 0%;
      }

      /* Match Arial's x-height to Outfit's (0.460em vs 0.519em). Vertical
         overrides use Outfit's 1000/-260/0 hhea metrics (1000 UPM), divided
         by size-adjust. */
      @font-face {
        font-family: 'Outfit Fallback';
        src: local('Arial');
        font-weight: 100 500;
        size-adjust: 88.63%;
        ascent-override: 112.83%;
        descent-override: 29.33%;
        line-gap-override: 0%;
      }

      :root {
        font-synthesis-weight: none;
        /* Lexend Deca carries body, UI and data; Outfit carries display
           headings. Lexend Deca has no tabular figures (no `tnum`), so
           `tabular-nums` does not align its digits. */
        --font-text: 'Lexend Deca Variable', 'Lexend Deca Fallback', Arial;
        --font-heading: 'Outfit Variable', 'Outfit Fallback', Arial;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
