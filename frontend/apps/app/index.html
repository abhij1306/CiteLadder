<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <!-- Apply the shared light/dark/system choice before first paint so a dark
        reader never sees a light frame. The cookie name must match
        THEME_COOKIE in lib/theme/theme.ts, which owns the preference. -->
    <script src="/theme-preference.js"></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>CiteLadder</title>
    <style>
      /* Cal Sans, Geist and Geist Mono are used when the reader has them
         installed; otherwise these metric-matched Arial faces stand in, so the
         layout is the same either way. The vertical overrides carry each
         face's hhea metrics divided by size-adjust. */
      @font-face {
        font-family: 'Cal Sans Fallback';
        src: local('Arial');
        font-weight: 400;
        size-adjust: 100.19%;
        ascent-override: 99.81%;
        descent-override: 29.94%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'Geist Fallback';
        src: local('Arial');
        font-weight: 100 500;
        size-adjust: 102.12%;
        ascent-override: 98.41%;
        descent-override: 28.89%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'Geist Mono Fallback';
        src: local('Courier New');
        font-weight: 100 500;
        size-adjust: 100%;
        ascent-override: 100.5%;
        descent-override: 29.5%;
        line-gap-override: 0%;
      }
      :root {
        font-synthesis-weight: none;
        /* Cal Sans sets the page title and display numbers, Geist everything
           people read and click, Geist Mono eyebrows, dates and code
           (globals.css reads these as --font-display, --font-sans and
           --font-mono). */
        --font-face-display: 'Cal Sans', 'Cal Sans Fallback';
        --font-face-sans: 'Geist Variable', 'Geist', 'Geist Fallback';
        --font-face-mono: 'Geist Mono Variable', 'Geist Mono', 'Geist Mono Fallback';
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
