<!doctype html>
<html lang="en">
  <head>
    <title>The Edna Wide Fit Selvedge Denim</title>
  </head>
  <body>
    <dialog aria-label="Shopping basket" class="overlay" open>
      <aside aria-label="Basket panel">
        <main aria-label="Basket contents">
          <h5>Your basket is currently empty</h5>
          <a href="/collections/denim">Continue shopping</a>
        </main>
      </aside>
    </dialog>
    <dialog aria-label="Site search" class="overlay" open>
      <aside aria-label="Search panel">
        <main aria-label="Search form">
          <form>
            <label for="site-search">Search</label>
            <input id="site-search" type="search" placeholder="Search" />
          </form>
        </main>
      </aside>
    </dialog>
    <dialog aria-label="Site menu" class="overlay" open>
      <aside aria-label="Menu panel">
        <main aria-label="Menu links">
          <a href="/shop">Shop</a>
          <a href="/story">Story</a>
          <a href="/guides">Guides</a>
        </main>
      </aside>
    </dialog>
    <main aria-label="Product details">
      <article>
        <h1>The Edna Wide Fit Selvedge Denim</h1>
        <p>Relaxed wide fit selvedge denim designed for movement and everyday wear.</p>
        <p>£325</p>
        <form action="/cart/add" method="post">
          <fieldset>
            <legend>Choose your size</legend>
            <label><input type="radio" name="size" value="28" /> 28</label>
            <label><input type="radio" name="size" value="30" /> 30</label>
          </fieldset>
          <button type="submit">Add to basket</button>
        </form>
        <p>In stock</p>
      </article>
    </main>
  </body>
</html>
